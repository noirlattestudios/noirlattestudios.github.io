<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Noirlatte Studios</title>
<meta name="description" content="Noirlatte Studios makes small, cozy games for Android.">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#16100c">
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(900px 500px at 50% -150px, #2c1f17 0%, #16100c 65%) fixed, #16100c; color: #eee3d4; font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
  .card { max-width: 520px; margin: 24px; padding: 32px 28px; text-align: center; background: #261c16; border: 1px solid #3a2b21; border-radius: 18px; }
  .cup { display: inline-block; width: 52px; height: 52px; border-radius: 50%; background: radial-gradient(circle at 50% 45%, #e9cfa4 0 28%, #8a5a3a 30% 52%, #3a261b 54% 100%); box-shadow: 0 0 0 3px #2b1f18, 0 6px 22px rgba(0,0,0,.5); }
  h1 { font-family: Georgia, "Times New Roman", serif; color: #e9cfa4; font-weight: 600; margin: 14px 0 6px; }
  h2 { font-family: Georgia, "Times New Roman", serif; color: #d8b07a; font-weight: 600; font-size: 20px; margin: 26px 0 6px; }
  p { margin: 6px 0; color: #d9cbb8; }
  a { color: #f0c88e; text-underline-offset: 3px; }
</style>
</head>
<body>
  <div class="card">
    <div class="cup" aria-hidden="true"></div>
    <h1>Noirlatte Studios</h1>
    <p>Small, cozy games for Android.</p>
    <h2>Contact</h2>
    <p><a href="mailto:noirlattestudios@gmail.com">noirlattestudios@gmail.com</a></p>
  </div>
</body>
</html>
